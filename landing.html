<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Resplandor Restaurante — página principal</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://resplandor.ynt.codes/">
<!-- La landing se mudó a la raíz (/). Esta página existe solo para no romper los enlaces ya
     publicados (Maps, Instagram, lo impreso). Con JavaScript, location.replace conserva la
     query y el ancla (landing.html#carta -> /#carta). Sin JavaScript, el meta refresh, que
     no puede conservarlas: por eso va dentro de <noscript>, para que quien tiene JavaScript
     no dependa de cuál de las dos navegaciones gana en su navegador. -->
<script>location.replace('/' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
<p>La página principal de Resplandor Restaurante está en la raíz del sitio: <a href="/">ir a la página principal</a>.</p>
</body>
</html>
