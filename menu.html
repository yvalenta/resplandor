<!-- ═══ Cabecera (idéntica en carta.html y menu.html): el letrero coral sobre telón, con
     la franja, y el nombre de la página como único <h1> (identidad-visual.md §10) ═══ -->
<header class="reveal sobre-telon bg-telon text-arroz text-center px-4 pt-8 pb-6" style="--i:0">
  <a href="/" class="inline-block" aria-label="Ir a la página principal de Resplandor Restaurante">
    <span class="monograma size-14"><img src="img/logo-r.webp" width="46" height="46" alt="" class="rounded-full"></span>
    <span class="rotulo mt-4" style="--rotulo:2.25rem">Resplandor</span>
    <span class="rotulo-sub">Restaurante</span>
  </a>
  <h1 class="font-display text-lg text-arroz mt-3">Menú de la semana</h1>
</header>
<div class="franja" aria-hidden="true"></div>

<!-- Navegación de semana: propia de menu.html (sticky, con estado de conexión y cola);
     misma lógica Alpine de siempre, solo reubicada fuera de la cabecera compartida. -->
<!-- Con menuDeHoy apagada (apagada === true) ni la navegación de semana, ni la grilla, ni los diálogos
     existen: todo va dentro de un <template x-if="!apagada"> y en su lugar sale el aviso de más abajo. -->
<template x-if="!apagada">
<nav class="sticky top-0 z-40 bg-arroz/90 backdrop-blur-md border-b border-linea" aria-label="Semana del menú">
    <!-- Estado de conexión: fila propia, solo ocupa espacio cuando hay algo que avisar
         (así no compite por ancho con los botones de la semana en pantallas angostas). -->
    <div class="max-w-5xl mx-auto px-4 pt-2 flex items-center justify-end gap-2" x-show="!online || cola.length > 0" x-cloak>
        <span x-show="!online" x-cloak class="badge badge-maiz" title="Sin conexión">
            <svg class="icono" style="width:12px;height:12px" aria-hidden="true"><use href="#i-wifi-off"/></svg> Offline
        </span>
        <span x-show="cola.length > 0" x-cloak class="badge badge-neutral" x-text="cola.length + ' por enviar'"></span>
    </div>
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-2">
        <button class="icon-btn" @click="cambiarSemana(-1)" aria-label="Semana anterior">
            <svg class="icono" style="width:18px;height:18px" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <button class="btn btn-outline" @click="irHoy()" style="padding:8px 14px;min-height:2.75rem">Hoy</button>
        <div class="flex-1 min-w-0 text-center">
            <div class="font-sans font-semibold leading-tight" x-text="tituloSemana"></div>
            <div class="text-[0.72rem] text-apoyo" x-text="rangoSemana"></div>
        </div>
        <button class="icon-btn" @click="cambiarSemana(1)" aria-label="Semana siguiente">
            <svg class="icono" style="width:18px;height:18px" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
    </div>
</nav>
</template>

<!-- Aviso de función apagada -->
<template x-if="apagada">
<main class="max-w-3xl mx-auto px-4 py-10">
    <div class="card card-soft text-center" style="padding:44px 24px">
        <div class="mx-auto w-11 h-11 rounded-full bg-arroz border border-linea flex items-center justify-center text-apoyo mb-3">
            <svg class="icono" aria-hidden="true"><use href="#i-calendar-days"/></svg>
        </div>
        <h2 class="font-medium">El menú de la semana no está disponible por ahora</h2>
        <p class="text-sm mt-1 text-apoyo">Volverá pronto. Mientras tanto, mira la carta o reserva tu mesa: abrimos todos los días, con desayunos de 7:00 a 11:00 de la mañana y almuerzos de 12:00 a 5:00 de la tarde.</p>
        <div class="mt-5 flex flex-wrap justify-center gap-2">
            <a href="carta.html" class="btn btn-primary">Ver la carta <svg class="icono" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
            <a :href="'https://wa.me/' + RESPLANDOR.whatsapp" target="_blank" rel="noopener" class="btn btn-claro">
                <svg class="icono" style="width:15px;height:15px" aria-hidden="true"><use href="#i-calendar-days"/></svg> Reservar por WhatsApp</a>
        </div>
    </div>
</main>
</template>

<template x-if="!apagada">
<main class="max-w-5xl mx-auto px-4 py-5">

    <!-- Cargando (skeleton) -->
    <div x-show="estado === 'cargando'" class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <template x-for="i in 6" :key="i"><div class="skel" style="height:150px"></div></template>
    </div>

    <!-- Sin conexión (el navegador SÍ está offline: acá culpar a la red es honesto). -->
    <div x-show="estado === 'offline' && !hayDatos" x-cloak class="card card-soft text-center" style="padding:44px 24px">
        <div class="mx-auto w-11 h-11 rounded-full bg-arroz border border-linea flex items-center justify-center text-apoyo mb-3">
            <svg class="icono" aria-hidden="true"><use href="#i-wifi-off"/></svg>
        </div>
        <p class="font-medium">Estás sin conexión</p>
        <p class="text-sm mt-1 text-apoyo">Revisa tu conexión e intenta de nuevo.</p>
        <button type="button" class="btn btn-claro mt-4" @click="cargar()">
            <svg class="icono" style="width:15px;height:15px" aria-hidden="true"><use href="#i-refresh-cw"/></svg> Reintentar
        </button>
    </div>

    <!-- Error al cargar (hallazgo H, ronda 4): el navegador SÍ tiene red — la falla es del
         servidor (p. ej. el 402 de cuota de Supabase), así que el texto ya no le echa la
         culpa a "tu conexión"; ícono del sprite (nunca un emoji) y el mismo patrón de
         acciones que usa index.html (la landing) en sus estados de error (#hoy/#carta): un botón
         chico y pálido "Reintentar" + un enlace, en vez de un btn-primary a todo el ancho. -->
    <div x-show="estado === 'error' && !hayDatos" x-cloak class="card card-soft text-center" style="padding:44px 24px">
        <div class="mx-auto w-11 h-11 rounded-full bg-arroz border border-linea flex items-center justify-center text-apoyo mb-3">
            <svg class="icono" aria-hidden="true"><use href="#i-utensils"/></svg>
        </div>
        <p class="font-medium">No pudimos cargar el menú</p>
        <p class="text-sm mt-1 text-apoyo">No pudimos cargar el menú en este momento.</p>
        <div class="mt-4 flex flex-wrap justify-center gap-2">
            <button type="button" class="btn btn-claro" @click="cargar()">
                <svg class="icono" style="width:15px;height:15px" aria-hidden="true"><use href="#i-refresh-cw"/></svg> Reintentar
            </button>
            <a href="carta.html" class="btn btn-ghost">Ver la carta <svg class="icono" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
        </div>
    </div>

    <!-- Sin menú publicado -->
    <div x-show="estado === 'listo' && !hayDatos" x-cloak class="card card-soft text-center" style="padding:44px 24px">
        <div style="font-size:2rem">📅</div>
        <p class="mt-2 font-medium">Aún no hay menú para esta semana</p>
        <p class="text-sm mt-1 text-apoyo">Vuelve pronto o revisa otra semana.</p>
    </div>

    <div x-show="estado === 'listo' && hayDatos" x-cloak>
        <p class="text-center text-sm mb-4 text-apoyo">
            Cada día tiene 2 menús — toca un día y vota por tu favorito 👇
        </p>

        <!-- Chips de día (móvil) -->
        <div class="md:hidden flex gap-2 overflow-x-auto no-scrollbar pb-1 mb-3">
            <template x-for="d in dias" :key="d.dia">
                <button class="chip-day" :class="d.esHoy ? 'sel' : ''" @click="abrirDia(d.dia)">
                    <span class="day-name" x-text="d.nombre.slice(0,3)"></span>
                    <span class="day-num" x-text="d.fecha.getDate()"></span>
                    <span x-show="d.esHoy" class="badge badge-neutral" style="padding:1px 6px;font-size:0.55rem">Hoy</span>
                </button>
            </template>
        </div>

        <!-- Grilla semana (desktop) -->
        <div class="hidden md:grid md:grid-cols-3 gap-3">
            <template x-for="d in dias" :key="d.dia">
                <div class="card card-soft day-cell" :class="d.esHoy ? 'hoy' : ''" @click="abrirDia(d.dia)">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="day-name" x-text="d.nombre"></div>
                            <div class="day-num" x-text="d.fecha.toLocaleDateString('es-CO',{day:'numeric',month:'short'})"></div>
                        </div>
                        <span x-show="d.esHoy" class="badge badge-turquesa">Hoy</span>
                    </div>
                    <template x-for="m in d.menus" :key="m.id">
                        <div class="opt-mini">
                            <div class="flex items-center gap-1.5">
                                <span class="badge" :class="m.fijo ? 'badge-maiz' : 'badge-neutral'" x-text="m.etiqueta"></span>
                            </div>
                            <div class="text-sm font-semibold mt-0.5 leading-tight"
                                 x-text="[m.sopa, m.principal].filter(Boolean).join(' · ')"></div>
                            <div class="text-xs leading-snug mt-0.5 text-apoyo"
                                 x-show="[m.guarnicion, m.ensalada, m.jugo].filter(Boolean).length"
                                 x-text="[m.guarnicion, m.ensalada, m.jugo].filter(Boolean).join(' · ')"></div>
                            <div class="flex gap-2 mt-1 text-xs text-apoyo">
                                <template x-if="m.opcion !== 3">
                                    <span>🗳️ <span x-text="conteoEleccion(m.dia, m.opcion)"></span> voto(s)<span x-show="conteo(m.id,'mover')"> · 📅 <span x-text="conteo(m.id,'mover')"></span></span></span>
                                </template>
                                <template x-if="m.opcion === 3">
                                    <span class="text-apoyo">Siempre disponible</span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</main>
</template>

<!-- ═══ Pie (idéntico en carta.html y menu.html) ═══
     Los enlaces van en su propia fila (no en medio de la frase de horario) para que
     .enlace-pie les pueda dar 44px de alto real sin agrandar solo una palabra dentro de
     una oración (hallazgo de zona táctil, ronda 3). -->
<footer class="mx-auto max-w-5xl px-4 pb-10 pt-6 mt-4 border-t border-linea text-[.8rem] text-apoyo space-y-1.5">
    <p>Resplandor Restaurante · Cra. 61 #79 Sur-62, La Estrella, Antioquia</p>
    <p>Desayunos todos los días, 7:00–11:00</p>
    <p>Todos los días, 12:00–17:00</p>
    <p class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <a class="enlace-pie text-telon hover:underline" href="https://wa.me/573225542434" target="_blank" rel="noopener">WhatsApp</a>
        <a class="enlace-pie text-telon hover:underline" href="/">Inicio</a>
        <a class="enlace-pie text-telon hover:underline" href="carta.html">Carta</a>
        <template x-if="!apagada"><a class="enlace-pie text-telon hover:underline" href="menu.html">Menú de la semana</a></template>
    </p>
    <!-- La firma de la casa y la versión del sitio (scripts/version.mjs escribe el número; una línea por sello). -->
    <p class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <a class="firma" href="https://ynt.codes" target="_blank" rel="noopener"><span>Ynt-labs</span></a>
        <span class="pie-version">versión <span data-version>2026.10.03-9178994</span></span>
    </p>
</footer>

<!-- ══════════ DIALOG: DÍA ══════════ -->
<template x-if="!apagada && diaSel">
    <div>
        <div class="overlay" @click="cerrarDia()"
             x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
        <div class="dialog" x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 sm:scale-95" x-transition:enter-end="opacity-100 sm:scale-100">
            <!-- Header dialog -->
            <div class="flex items-center gap-3 px-5 py-4" style="border-bottom:1px solid var(--color-linea)">
                <div class="flex-1">
                    <div class="day-name" x-text="diaSelData?.nombre"></div>
                    <div class="font-sans text-lg font-semibold leading-tight"
                         x-text="diaSelData?.fecha.toLocaleDateString('es-CO',{day:'numeric',month:'long'})"></div>
                </div>
                <span x-show="diaSelData?.esHoy" class="badge badge-turquesa">Hoy</span>
                <button class="icon-btn" @click="cerrarDia()" aria-label="Cerrar"><svg class="icono" style="width:17px;height:17px" aria-hidden="true"><use href="#i-x"/></svg></button>
            </div>

            <!-- Cuerpo scrollable -->
            <div class="px-5 py-4 dialog-body">
                <template x-for="m in (diaSelData?.menus || [])" :key="m.id">
                    <div class="card mb-4" style="padding:15px">
                        <div class="flex items-center justify-between mb-2.5">
                            <span class="badge" :class="m.fijo ? 'badge-maiz' : 'badge-turquesa'" x-text="m.etiqueta"></span>
                            <span x-show="m.fijo" class="text-[0.68rem] text-apoyo">Todos los días</span>
                        </div>

                        <!-- Componentes -->
                        <div>
                            <template x-for="c in componentes(m)" :key="c.k">
                                <div class="comp-row">
                                    <span class="comp-em" x-text="c.em"></span>
                                    <span class="comp-k" x-text="c.k"></span>
                                    <span class="comp-v" x-text="c.v"></span>
                                </div>
                            </template>
                        </div>

                        <!-- Especial de la casa: sin votación -->
                        <template x-if="m.opcion === 3">
                            <div class="mt-3 text-center text-sm bg-maiz text-telon rounded-xl p-[11px]">
                                ⭐ Especial de la casa — siempre disponible, sin votación
                            </div>
                        </template>

                        <!-- Opciones 1 y 2: elegir este menú + mover a otro día -->
                        <template x-if="m.opcion !== 3">
                            <div class="mt-3">
                                <button class="btn w-full" :class="miEleccion(m.dia) === m.opcion ? 'btn-primary' : 'btn-outline'"
                                        @click="elegir(m.dia, m.opcion)">
                                    <span x-show="miEleccion(m.dia) === m.opcion">✓ Tu elección</span>
                                    <span x-show="miEleccion(m.dia) !== m.opcion">Elegir este menú</span>
                                </button>
                                <div class="mt-2 h-1.5 rounded-full overflow-hidden bg-linea">
                                    <div :style="`width:${porcentajeEleccion(m.dia, m.opcion)}%;height:100%;background:var(--color-turquesa);transition:width .3s`"></div>
                                </div>
                                <div class="flex items-center justify-between mt-1.5 text-xs text-apoyo">
                                    <span x-text="conteoEleccion(m.dia, m.opcion) + ' voto(s) · ' + porcentajeEleccion(m.dia, m.opcion) + '%'"></span>
                                    <button class="btn btn-ghost" style="padding:4px 9px;font-size:0.78rem"
                                            :style="miReaccion(m.id)?.tipo === 'mover' ? 'color:var(--color-turquesa)' : ''"
                                            @click="abrirMover(m)">
                                        <svg class="icono" style="width:.85rem;height:.85rem" aria-hidden="true"><use href="#i-calendar-days"/></svg> Mover a otro día</button>
                                </div>
                            </div>
                        </template>

                        <!-- Popover mover -->
                        <div x-show="moverMenu === m.id" x-cloak x-transition class="mt-3 p-3 rounded-xl bg-papel border border-linea">
                            <div class="text-xs font-semibold mb-2 text-turquesa">¿Para qué día lo sugieres?</div>
                            <div class="flex flex-wrap gap-1.5 mb-2">
                                <template x-for="d in dias" :key="d.dia">
                                    <button class="chip-day" style="min-width:auto;padding:5px 10px"
                                            :class="moverForm.dia === d.dia ? 'sel' : ''" @click="moverForm.dia = d.dia">
                                        <span class="day-name" x-text="d.nombre.slice(0,3)"></span>
                                    </button>
                                </template>
                            </div>
                            <input type="text" class="field" x-model="moverForm.comentario" placeholder="Comentario (opcional)" maxlength="140" />
                            <div class="flex gap-2 mt-2 justify-end">
                                <button class="btn btn-ghost" style="padding:7px 12px" @click="moverMenu = null">Cancelar</button>
                                <button class="btn btn-primary" style="padding:7px 14px" :disabled="!moverForm.dia" @click="confirmarMover(m)">Enviar</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Footer: sugerir plato -->
            <div class="px-5 py-3" style="border-top:1px solid var(--color-linea)">
                <button class="btn btn-outline w-full" @click="abrirSugerir()">
                    <svg class="icono" style="width:15px;height:15px" aria-hidden="true"><use href="#i-lightbulb"/></svg>
                    Sugerir un plato o menú
                </button>
            </div>
        </div>
    </div>
</template>

<!-- ══════════ DIALOG: SUGERIR PLATO ══════════ -->
<template x-if="!apagada && sugerirAbierto">
    <div>
        <div class="overlay" @click="sugerirAbierto = false"></div>
        <div class="dialog" style="max-height:none">
            <div class="flex items-center gap-3 px-5 py-4" style="border-bottom:1px solid var(--color-linea)">
                <div class="flex-1 font-display text-lg font-semibold">Sugerir un plato</div>
                <button class="icon-btn" @click="sugerirAbierto = false" aria-label="Cerrar"><svg class="icono" style="width:17px;height:17px" aria-hidden="true"><use href="#i-x"/></svg></button>
            </div>
            <div class="px-5 py-4 dialog-body">
                <p class="text-sm mb-3 text-apoyo">
                    ¿Qué te gustaría comer? Tu idea llega directo a la cocina.
                </p>
                <textarea class="field" rows="3" x-model="sugerirTexto" maxlength="200"
                          placeholder="Ej: Me encantaría un mote de queso o una lasaña casera"></textarea>

            <div class="px-5 py-3 flex gap-2 justify-end" style="border-top:1px solid var(--color-linea)">
                <button class="btn btn-ghost" @click="sugerirAbierto = false">Cancelar</button>
                <button class="btn btn-primary" :disabled="!sugerirTexto.trim()" @click="enviarSugerencia()">
                    <svg class="icono" style="width:14px;height:14px" aria-hidden="true"><use href="#i-send"/></svg> Enviar
                </button>

<!-- Toast -->
<div x-data x-show="$store.toastMsg" x-cloak class="toast" x-text="$store.toastMsg"
     x-transition:enter="transition ease-out" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100"></div>

<script>
    const SUPABASE_URL = 'https://lccgehvyymladqvumcez.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_034ZAmpVk0MRwQ9H5HZz-w_lPFGKf3x';
    const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    // "Hoy"/día de la semana en hora de Colombia (America/Bogota, UTC−5 fijo: el país no
    // tiene horario de verano), NUNCA en la hora del navegador de quien mira la página —
    // mismo criterio y misma técnica que assets/js/vivo.js (que esta página no carga: es
    // de lectura/escritura con supabase-js directo, no de RESPLANDOR_VIVO). Se corre el
    // instante 5 horas hacia atrás y se leen los campos UTC de ESE instante desplazado:
    // un visitante en Madrid a la 01:00 de su martes (18:00 del lunes en Bogotá) tiene
    // que ver el lunes, no el martes de su propio reloj.
    function bogota(fecha) {
        return new Date(new Date(fecha).getTime() - 5 * 60 * 60 * 1000);
    }
    function diaSemanaBogota(fecha) {
        const dow = bogota(fecha).getUTCDay();
        return dow === 0 ? 7 : dow;
    }
    function lunesDe(fecha) {
        const d = bogota(fecha);
        const dow = diaSemanaBogota(fecha);
        d.setUTCDate(d.getUTCDate() - (dow - 1));
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(d.getUTCDate()).padStart(2, '0');
        return `${d.getUTCFullYear()}-${mm}-${dd}`;
    }

    // Distinta de lunesDe/diaSemanaBogota a propósito: esas dos responden «¿qué día es
    // AHORA mismo en Bogotá?» (un instante real, siempre new Date()). Esta responde
    // «¿qué fecha cae N semanas antes/después de esta OTRA fecha ya conocida?» — pura
    // aritmética de calendario, sin instante real de por medio. Usar lunesDe() acá (como
    // hacía antes esta página) mezclaba las dos cosas: le pasaba una medianoche LOCAL del
    // lunes mostrado, lunesDe le restaba otras 5 horas de Bogotá y, para un navegador
    // adelantado a Bogotá (España, por ejemplo), la fecha caía en el día de calendario
    // ANTERIOR — «Semana siguiente» terminaba devolviendo la semana ya mostrada.
    function sumarSemanas(semanaISO, deltaSemanas) {
        const [y, m, d] = semanaISO.split('-').map(Number);
        const fecha = new Date(Date.UTC(y, m - 1, d));
        fecha.setUTCDate(fecha.getUTCDate() + deltaSemanas * 7);
        const mm = String(fecha.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(fecha.getUTCDate()).padStart(2, '0');
        return `${fecha.getUTCFullYear()}-${mm}-${dd}`;
    }

    document.addEventListener('alpine:init', () => { Alpine.store('toastMsg', ''); });

    // Función menuDeHoy (assets/js/local.js). Apagada: la página es solo un aviso, sin supabase-js,
    // sin cliente y sin ninguna llamada a Supabase (tampoco toca localStorage: ni id de dispositivo,
    // ni cola de reintentos). Se le pide a los buscadores que no la indexen.
    function menuActivo() {
        return Boolean(window.RESPLANDOR && window.RESPLANDOR.funciones && window.RESPLANDOR.funciones.menuDeHoy);
    }
    function menuApagado() {
        return {
            apagada: true,
            estado: 'apagada',
            init() {
                document.title = 'Menú de la semana · por ahora no está disponible · Resplandor';
                const descripcion = document.querySelector('meta[name="description"]');
                if (descripcion) descripcion.setAttribute('content', 'El menú de la semana de Resplandor Restaurante no está disponible por ahora. Mira la carta o reserva tu mesa.');
                // Alpine llama a init() solo y también lo pide x-init="init()": una sola meta.
                if (!document.querySelector('meta[name="robots"]')) {
                    const robots = document.createElement('meta');
                    robots.setAttribute('name', 'robots');
                    robots.setAttribute('content', 'noindex');
                    document.head.appendChild(robots);
                }
            },
        };
    }

    function menuCal() {
        if (!menuActivo()) return menuApagado();
        // Sin sesión: la votación es pública (anon). Con las opciones por defecto, supabase-js leería la sesión de
        // Google que el POS guarda en el MISMO navegador (localStorage, mismo origen) y pediría `menus` como esa cuenta:
        // desde que el POS tiene compuerta de personal (`solo_personal`), una tablet con la sesión de alguien que no
        // está en `personal` vería la votación sin menús (SDD docs/sdd-cuenta-en-mesa.md §03.8). Es el mismo cliente
        // sin sesión que usa carta.html.
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
        });

        return {
            apagada: false,
            estado: 'cargando',            // cargando | listo | error | offline
            online: navigator.onLine,
            semana: lunesDe(new Date()),
            menusSemana: [],
            elecciones: [],                // voto: 1 elección por día por dispositivo
            reacciones: [],                // solo 'mover a otro día'
            cola: [],                      // reintentos pendientes (localStorage)

            diaSel: null,                  // día abierto en el dialog
            moverMenu: null,               // menu_id con el popover "mover" abierto
            moverForm: { dia: null, comentario: '' },
            sugerirAbierto: false,
            sugerirTexto: '',
            _canal: null,                  // canal Realtime de broadcast (por semana)
            _canalSemana: null,
            _bcT: null,                    // debounce del refresco por broadcast

            deviceId: (() => {
                let id = localStorage.getItem('menu_device_id');
                if (!id) { id = uid(); localStorage.setItem('menu_device_id', id); }
                return id;
            })(),

            init() {
                try { this.cola = JSON.parse(localStorage.getItem('menu_retry_queue') || '[]'); } catch { this.cola = []; }
                window.addEventListener('online', () => { this.online = true; this.flushCola(); this.cargar(); });
                window.addEventListener('offline', () => { this.online = false; });
                setInterval(() => { if (this.online && this.cola.length) this.flushCola(); }, 20000);
                this.cargar();
                this.$watch('diaSel', v => { document.body.style.overflow = v ? 'hidden' : ''; });
            },

            get hayDatos() { return this.menusSemana.length > 0; },

            get tituloSemana() {
                return new Date(this.semana + 'T00:00:00').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' })
                    .replace(/^\w/, c => c.toUpperCase());
            },
            get rangoSemana() {
                const ini = new Date(this.semana + 'T00:00:00');
                const fin = new Date(ini); fin.setDate(fin.getDate() + 5);
                const f = d => d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
                return `${f(ini)} – ${f(fin)}`;
            },
            get diaHoy() {
                if (lunesDe(new Date()) !== this.semana) return null;
                const dow = diaSemanaBogota(new Date());
                return dow >= 1 && dow <= 6 ? dow : null;
            },
            fechaDe(d) { const b = new Date(this.semana + 'T00:00:00'); b.setDate(b.getDate() + (d - 1)); return b; },

            get dias() {
                const arr = [];
                for (let d = 1; d <= 6; d++) {
                    const menus = this.menusSemana.filter(m => m.dia === d).sort((a, b) => a.opcion - b.opcion);
                    if (!menus.length) continue;
                    arr.push({ dia: d, nombre: DIAS[d], fecha: this.fechaDe(d), esHoy: this.diaHoy === d, menus });
                }
                return arr;
            },
            get diaSelData() { return this.dias.find(d => d.dia === this.diaSel) || null; },

            componentes(m) {
                return [
                    { k: 'Sopa', em: '🥣', v: m.sopa },
                    { k: 'Principal', em: '🍽️', v: m.principal },
                    { k: 'Guarnición', em: '🍚', v: m.guarnicion },
                    { k: 'Ensalada', em: '🥗', v: m.ensalada },
                    { k: 'Jugo', em: '🥤', v: m.jugo },
                ].filter(c => c.v && c.v.trim());
            },

            conteo(menuId, tipo) { return this.reacciones.filter(r => r.menu_id === menuId && r.tipo === tipo).length; },
            miReaccion(menuId) { return this.reacciones.find(r => r.menu_id === menuId && r.device_id === this.deviceId) || null; },

            // ---- Elección del día (votar 1 de las 2 opciones) ----
            miEleccion(dia) {
                const e = this.elecciones.find(x => x.dia === dia && x.device_id === this.deviceId);
                return e ? e.opcion_elegida : null;
            },
            conteoEleccion(dia, opcion) {
                return this.elecciones.filter(e => e.dia === dia && e.opcion_elegida === opcion).length;
            },
            porcentajeEleccion(dia, opcion) {
                const t = this.conteoEleccion(dia, 1) + this.conteoEleccion(dia, 2);
                return t ? Math.round(this.conteoEleccion(dia, opcion) / t * 100) : 0;
            },
            async elegir(dia, opcion) {
                if (this.miEleccion(dia) === opcion) return;
                this.elecciones = this.elecciones.filter(e => !(e.dia === dia && e.device_id === this.deviceId));
                this.elecciones.push({ dia, opcion_elegida: opcion, device_id: this.deviceId });
                this.cachearActual();

                const body = { semana: this.semana, dia, opcion, device_id: this.deviceId };
                try {
                    await this.invocarVoto('eleccion', body);
                    this.toast('¡Gracias por tu voto!');
                } catch (e) {
                    console.error('Voto fallido, encolando', e);
                    this.encolar({ action: 'eleccion', body });
                    this.toast('Sin conexión — se enviará solo');
                }
            },

            // Escritura pública centralizada: pasa por la Edge Function `votar`
            // (valida + rate-limit + escribe con service-role). Ya no se hace
            // upsert directo desde el cliente (la RLS anon está cerrada).
            async invocarVoto(action, body) {
                const { data, error } = await sb.functions.invoke('votar', { body: { action, ...body } });
                if (error) throw error;
                if (data && data.error) throw new Error(data.error);
                return data;
            },

            // ---- Carga con caché + tolerancia a fallos ----
            async cargar() {
                try {
                    const cache = JSON.parse(localStorage.getItem('menu_cache_' + this.semana) || 'null');
                    if (cache) {
                        this.menusSemana = cache.menus; this.reacciones = cache.reacciones || [];
                        this.elecciones = cache.elecciones || []; this.estado = 'listo';
                    }
                    else if (this.estado !== 'listo') this.estado = 'cargando';
                } catch { }

                try {
                    const { data: menus, error: e1 } = await sb.from('menus')
                        .select('*').eq('semana', this.semana).eq('activo', true).order('dia').order('opcion');
                    if (e1) throw e1;
                    let reacc = [];
                    if (menus.length) {
                        const ids = menus.map(m => m.id);
                        const { data, error: e2 } = await sb.from('reacciones_menu')
                            .select('menu_id, tipo, dia_sugerido, comentario, device_id').in('menu_id', ids);
                        if (e2) throw e2;
                        reacc = data || [];
                    }
                    const { data: elec, error: e4 } = await sb.from('elecciones_menu')
                        .select('dia, opcion_elegida, device_id').eq('semana', this.semana);
                    if (e4) throw e4;
                    this.menusSemana = menus;
                    this.reacciones = reacc;
                    this.elecciones = elec || [];
                    this.cachearActual();
                    this.estado = 'listo';
                    this.suscribirBroadcast();
                } catch (e) {
                    // console.warn (no .error, no silencio): el 402 de la cuota de Supabase
                    // es un fallo esperado y conocido (ver docs/landing-y-agentes.md), igual
                    // que ya lo registra la landing en sus secciones en vivo.
                    console.warn('Resplandor — menú de la semana:', e);
                    if (this.hayDatos) this.estado = 'listo';           // sirve caché
                    else this.estado = navigator.onLine ? 'error' : 'offline';
                }
            },

            cambiarSemana(delta) {
                this.semana = sumarSemanas(this.semana, delta);
                this.diaSel = null;
                this.cargar();
            },
            irHoy() { this.semana = lunesDe(new Date()); this.diaSel = null; this.cargar(); },

            // ---- Broadcast en vivo: los conteos se mueven solos, sin recargar ----
            suscribirBroadcast() {
                if (this._canalSemana === this.semana && this._canal) return;
                if (this._canal) { try { sb.removeChannel(this._canal); } catch { } }
                this._canalSemana = this.semana;
                this._canal = sb.channel('menu-' + this.semana)
                    .on('broadcast', { event: 'voto' }, () => this.onBroadcast())
                    .subscribe();
            },
            onBroadcast() {
                clearTimeout(this._bcT);
                this._bcT = setTimeout(() => this.refrescarConteos(), 250);
            },
            async refrescarConteos() {
                try {
                    const { data: elec } = await sb.from('elecciones_menu')
                        .select('dia, opcion_elegida, device_id').eq('semana', this.semana);
                    if (elec) this.elecciones = elec;
                    if (this.menusSemana.length) {
                        const ids = this.menusSemana.map(m => m.id);
                        const { data: reac } = await sb.from('reacciones_menu')
                            .select('menu_id, tipo, dia_sugerido, comentario, device_id').in('menu_id', ids);
                        if (reac) this.reacciones = reac;
                    }
                    this.cachearActual();
                } catch (e) { /* silencioso: se refresca en el próximo evento */ }
            },

            abrirDia(d) { this.diaSel = d; this.moverMenu = null; },
            cerrarDia() { this.diaSel = null; this.moverMenu = null; },

            // ---- Reacciones (optimista + rollback + cola) ----
            async reaccionar(menu, tipo, extra = {}) {
                const previa = this.miReaccion(menu.id);
                if (previa && previa.tipo === tipo && tipo !== 'mover') return;

                const nueva = {
                    menu_id: menu.id, tipo,
                    dia_sugerido: extra.dia_sugerido ?? null,
                    comentario: extra.comentario ?? '',
                    device_id: this.deviceId
                };
                this.reacciones = this.reacciones.filter(r => !(r.menu_id === menu.id && r.device_id === this.deviceId));
                this.reacciones.push(nueva);
                this.cachearActual();

                const body = { menu_id: menu.id, semana: this.semana, dia_sugerido: nueva.dia_sugerido, comentario: nueva.comentario, device_id: this.deviceId };
                try {
                    await this.invocarVoto('mover', body);
                    this.toast(tipo === 'mover' ? 'Sugerencia registrada ✓' : '¡Gracias por tu voto!');
                } catch (e) {
                    console.error('Voto fallido, encolando', e);
                    this.encolar({ action: 'mover', body });
                    this.toast('Sin conexión — se enviará solo');
                }
            },

            abrirMover(menu) {
                if (this.moverMenu === menu.id) { this.moverMenu = null; return; }
                const previa = this.miReaccion(menu.id);
                this.moverForm = {
                    dia: previa?.tipo === 'mover' ? previa.dia_sugerido : null,
                    comentario: previa?.tipo === 'mover' ? (previa.comentario || '') : ''
                };
                this.moverMenu = menu.id;
            },
            confirmarMover(menu) {
                if (!this.moverForm.dia) return;
                this.reaccionar(menu, 'mover', { dia_sugerido: this.moverForm.dia, comentario: this.moverForm.comentario.trim() });
                this.moverMenu = null;
            },

            // ---- Sugerir plato ----
            abrirSugerir() { this.sugerirTexto = ''; this.sugerirAbierto = true; },
            async enviarSugerencia() {
                const texto = this.sugerirTexto.trim();
                if (!texto) return;
                const body = { semana: this.semana, dia: this.diaSel, texto, device_id: this.deviceId };
                this.sugerirAbierto = false;
                try {
                    await this.invocarVoto('sugerencia', body);
                    this.toast('¡Gracias por tu sugerencia! 🙌');
                } catch (e) {
                    console.error('Sugerencia fallida, encolando', e);
                    this.encolar({ action: 'sugerencia', body });
                    this.toast('Sin conexión — se enviará solo');
                }
            },

            // ---- Cola de reintentos ----
            encolar(op) { this.cola.push(op); this.guardarCola(); },
            guardarCola() { localStorage.setItem('menu_retry_queue', JSON.stringify(this.cola)); },
            cachearActual() {
                localStorage.setItem('menu_cache_' + this.semana, JSON.stringify({
                    menus: this.menusSemana, reacciones: this.reacciones, elecciones: this.elecciones
                }));
            },
            async flushCola() {
                const pendientes = [...this.cola];
                for (const op of pendientes) {
                    try {
                        // Formato nuevo: { action, body }. Compat con la cola vieja { kind, fila }.
                        const action = op.action || (op.kind === 'reaccion' ? 'mover' : op.kind);
                        const body = op.body || this._legacyBody(op);
                        await this.invocarVoto(action, body);
                        this.cola = this.cola.filter(x => x !== op);
                        this.guardarCola();
                    } catch (e) { break; }   // deja el resto para el próximo intento
                }
            },
            _legacyBody(op) {
                const f = op.fila || {};
                if (op.kind === 'eleccion') return { semana: f.semana, dia: f.dia, opcion: f.opcion_elegida, device_id: f.device_id };
                if (op.kind === 'reaccion') return { menu_id: f.menu_id, semana: f.semana || this.semana, dia_sugerido: f.dia_sugerido, comentario: f.comentario, device_id: f.device_id };
                if (op.kind === 'sugerencia') return { semana: f.semana, dia: f.dia, texto: f.texto, device_id: f.device_id };
                return {};
            },

            toast(msg) {
                Alpine.store('toastMsg', msg);
                clearTimeout(this._t);
                this._t = setTimeout(() => Alpine.store('toastMsg', ''), 2400);
            }
        };
    }
</script>
